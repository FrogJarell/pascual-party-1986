<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact — Pascual's 80's Christmas Party 1986</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Pascual's 80's</a>
    <ul class="nav-links">
      <li><a href="index.html">Program</a></li>
      <li><a href="budget.html">Budget</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>

  <main class="page">
    <div class="card">
      <!-- Pine Sprig Illustration -->
      <svg class="sprig" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 150 C60 100 55 60 60 10" fill="none" stroke="#2f4a3c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M60 40 C40 30 28 16 22 4" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 60 C82 50 96 34 104 20" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 82 C40 74 26 60 18 48" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 100 C80 92 92 78 100 66" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="6" r="4" fill="#b23a2e"/>
        <circle cx="106" cy="22" r="4" fill="#b23a2e"/>
        <circle cx="16" cy="50" r="4" fill="#b23a2e"/>
        <circle cx="102" cy="68" r="4" fill="#b23a2e"/>
        <circle cx="60" cy="10" r="4" fill="#b23a2e"/>
      </svg>

      <p class="eyebrow">Contact & RSVP</p>

      <div class="title-block">
        <h1>Get in Touch</h1>
        <div class="subtitle">Questions? Send us a message!</div>
        <div class="venue-info">
          Reach out to the party organizers for any concerns about the event.
        </div>
      </div>

      <div class="rule"></div>

      <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent! (demo)');">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email / Phone</label>
          <input type="text" id="email" placeholder="How should we reach you?" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Your message, questions, or RSVP details..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>

      <div class="party-footer">
        <div class="row"><span class="k">Organizer</span><span>Paras Family</span></div>
        <div class="row"><span class="k">Message</span><span>Homer Pascual</span></div>
        <div class="row"><span class="k">Venue</span><span>Texon's Cabin Resort</span></div>
      </div>

      <div class="tagline">Let's Party Like It's 1986!</div>
    </div>
  </main>

</body>
</html>
