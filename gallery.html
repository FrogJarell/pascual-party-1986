<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Gallery — Pascual's 80's Christmas Party 1986</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">Pascual's 80's</a>
  </nav>

  <main class="page">
    <div class="card">
      <!-- Pine Sprig Illustration -->
      <svg class="sprig" viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 150 C60 100 55 60 60 10" fill="none" stroke="#2f4a3c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M60 40 C40 30 28 16 22 4" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 60 C82 50 96 34 104 20" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 82 C40 74 26 60 18 48" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <path d="M60 100 C80 92 92 78 100 66" fill="none" stroke="#2f4a3c" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="6" r="4" fill="#b23a2e"/>
        <circle cx="106" cy="22" r="4" fill="#b23a2e"/>
        <circle cx="16" cy="50" r="4" fill="#b23a2e"/>
        <circle cx="102" cy="68" r="4" fill="#b23a2e"/>
        <circle cx="60" cy="10" r="4" fill="#b23a2e"/>
      </svg>

      <p class="eyebrow">Gallery</p>

      <div class="title-block">
        <h1>Venue Showcase</h1>
        <div class="subtitle">Texon's Cabin Resort and Events Place</div>
        <div class="venue-info">
          Where the magic happens — December 25-26
        </div>
      </div>

      <div class="rule"></div>

      <!-- Venue Link -->
      <div class="venue-link">
        <img src="images/gallery/venue-profile.jpg" alt="Venue Profile" class="venue-profile-img">
        <div class="venue-info-text">
          <h4>Texon's Cabin Resort and Events Place</h4>
          <p>Follow their page for updates and more photos</p>
          <a href="https://www.facebook.com/profile.php?id=61585690243774" target="_blank" class="venue-fb-link">Visit on Facebook →</a>
        </div>
      </div>

      <!-- Gallery Grid -->
      <div class="gallery-grid">
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue1.jpg')">
          <img src="images/gallery/venue1.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue2.jpg')">
          <img src="images/gallery/venue2.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue3.jpg')">
          <img src="images/gallery/venue3.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue4.jpg')">
          <img src="images/gallery/venue4.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue5.jpg')">
          <img src="images/gallery/venue5.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue6.jpg')">
          <img src="images/gallery/venue6.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue7.jpg')">
          <img src="images/gallery/venue7.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue8.jpg')">
          <img src="images/gallery/venue8.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue9.jpg')">
          <img src="images/gallery/venue9.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue10.jpg')">
          <img src="images/gallery/venue10.jpg" alt="Venue" class="gallery-img">
        </div>
        <div class="gallery-item" onclick="openLightbox('images/gallery/venue11.jpg')">
          <img src="images/gallery/venue11.jpg" alt="Venue" class="gallery-img">
        </div>
      </div>

      <div class="tagline">Let's Party Like It's 1986!</div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img src="" alt="Full size" class="lightbox-img" id="lightbox-img">
  </div>

  <!-- Bottom Tab Bar Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="tab">Program</a>
    <a href="budget.html" class="tab">Budget</a>
    <a href="foods.html" class="tab">Foods</a>
    <a href="games.html" class="tab">Games</a>
    <a href="gallery.html" class="tab active">Gallery</a>
  </nav>

  <script>
    function openLightbox(src){
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox(){
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
